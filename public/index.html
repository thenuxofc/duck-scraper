<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duck.ai Pro Scraper</title>
    <style>
        :root {
            --bg-color: #111111;
            --chat-bg: #1a1a1a;
            --user-bg: #2f55d4;
            --ai-bg: #2a2a2a;
            --text-color: #e0e0e0;
            --accent: #007bff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 15px 20px;
            background: #000;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 { font-size: 1.2rem; font-weight: 600; }
        .status { font-size: 0.8rem; color: #888; }
        .status.ready { color: #4caf50; }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }

        .user {
            align-self: flex-end;
            background-color: var(--user-bg);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .ai {
            align-self: flex-start;
            background-color: var(--ai-bg);
            border-bottom-left-radius: 2px;
            border: 1px solid #333;
        }

        .loading {
            opacity: 0.7;
            font-style: italic;
            font-size: 0.9rem;
        }

        #input-area {
            padding: 20px;
            background: #000;
            border-top: 1px solid #333;
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 24px;
            border: 1px solid #444;
            background: #222;
            color: white;
            outline: none;
            font-size: 1rem;
        }

        input:focus { border-color: var(--accent); }

        button {
            padding: 0 20px;
            border-radius: 24px;
            border: none;
            background: var(--accent);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <h1>Duck.ai Scraper</h1>
        <div id="status" class="status">Initializing...</div>
    </header>

    <div id="chat-container">
        <!-- Messages go here -->
    </div>

    <div id="input-area">
        <input type="text" id="user-input" placeholder="Type a message..." autocomplete="off">
        <button id="send-btn">Send</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const statusEl = document.getElementById('status');
        
        let chatHistory = JSON.parse(localStorage.getItem('duckChatHistory')) || [];
        let selectedModel = null; 
        let isProcessing = false;

        document.addEventListener('DOMContentLoaded', () => {
            renderHistory();
            // We use a fallback model to avoid dependency on external proxies
            selectedModel = "llama-3.1-70b"; 
            statusEl.textContent = "Ready";
            statusEl.className = "status ready";
            userInput.focus();
        });

        async function sendMessage() {
            if (isProcessing || !userInput.value.trim()) return;
            
            const text = userInput.value.trim();
            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;
            isProcessing = true;

            addMessage('user', text);
            const loadingMsg = addMessage('ai', '<span class="loading">Thinking...</span>', false);

            try {
                // 1. Call the Netlify Function
                const payload = {
                    prompt: text,
                    model: selectedModel,
                    messages: chatHistory.map(h => ({
                        role: h.role === 'user' ? 'human' : 'assistant',
                        content: h.content
                    })),
                    conversation_id: null
                };

                const response = await fetch('/.netlify/functions/scrape', {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error("API Error");

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullResponse = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const jsonStr = line.slice(6).trim();
                            if (!jsonStr) continue;
                            try {
                                const parsed = JSON.parse(jsonStr);
                                if (parsed.type === 'message' && parsed.delta) {
                                    fullResponse += parsed.delta;
                                    loadingMsg.innerHTML = fullResponse.replace(/\n/g, '<br>');
                                }
                            } catch (e) {}
                        }
                    }
                }

                if (fullResponse) {
                    loadingMsg.innerHTML = fullResponse.replace(/\n/g, '<br>');
                    addMessageToHistory('ai', fullResponse);
                } else {
                    loadingMsg.innerHTML = "No response received.";
                }

            } catch (error) {
                loadingMsg.innerHTML = `Error: ${error.message}. <br><small>Check console for details.</small>`;
                console.error("Chat Error:", error);
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                isProcessing = false;
                userInput.focus();
                scrollToBottom();
            }
        }

        function addMessage(role, content, save = true) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerHTML = content;
            chatContainer.appendChild(div);
            scrollToBottom();
            
            if (save) {
                addMessageToHistory(role, content.replace(/<br>/g, '\n').replace(/<[^>]*>/g, ''));
            }
            return div;
        }

        function addMessageToHistory(role, content) {
            chatHistory.push({ role, content });
            if (chatHistory.length > 20) chatHistory = chatHistory.slice(-10);
            localStorage.setItem('duckChatHistory', JSON.stringify(chatHistory));
        }

        function renderHistory() {
            chatContainer.innerHTML = '';
            chatHistory.forEach(msg => {
                const div = document.createElement('div');
                div.className = `message ${msg.role}`;
                div.innerHTML = msg.content.replace(/\n/g, '<br>');
                chatContainer.appendChild(div);
            });
            scrollToBottom();
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
